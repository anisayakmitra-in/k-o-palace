services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kopalace
      POSTGRES_USER: kopalace
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopalace -d kopalace"]
      interval: 10s
      timeout: 5s
      retries: 5

  palace:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kopalace:change-me@postgres:5432/kopalace
      PALACE_BIND: 0.0.0.0:3001
      PALACE_PUBLIC_URL: http://localhost:3001
      PALACE_CORS_ORIGINS: http://localhost:3001
      PALACE_DB_MAX_CONNECTIONS: "10"
    ports:
      - "3001:3001"

volumes:
  postgres-data: