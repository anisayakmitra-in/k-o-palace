name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kopalace
          POSTGRES_PASSWORD: kopalace
          POSTGRES_DB: kopalace_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --all-targets --features postgres
      - name: Run clippy
        run: cargo clippy --locked --all-targets --features postgres -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets --features postgres -- --test-threads=1
        env:
          KOP_TEST_DATABASE_URL: postgres://kopalace:kopalace@localhost:5432/kopalace_release
      - name: Verify migrations
        run: |
          cargo install sqlx-cli --no-default-features --features postgres,rustls
          sqlx migrate run --source migrations
        env:
          DATABASE_URL: postgres://kopalace:kopalace@localhost:5432/kopalace_release
      - name: Audit dependencies
        run: cargo install cargo-audit --locked && cargo audit
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          cp "target/${TARGET}/release/k-o-palace" dist/stage/k-o-palace
          cp LICENSE README.md dist/stage/
          archive="dist/k-o-palace-${VERSION}-${TARGET}.tar.gz"
          tar -C dist/stage -czf "$archive" .
          sha256sum "$archive" > "${archive}.sha256"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          $stage = "dist\stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target\$env:TARGET\release\k-o-palace.exe" "$stage\k-o-palace.exe"
          Copy-Item LICENSE,README.md $stage
          $archive = "dist\k-o-palace-$env:VERSION-$env:TARGET.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "${archive}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sbom:
    name: Generate release SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx -f json
          mv *.cdx.json k-o-palace-${{ inputs.tag || github.ref_name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: k-o-palace-*.cdx.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: release-sbom
          path: dist
      - name: Create checksum manifest
        working-directory: dist
        run: cat *.sha256 | sort > "k-o-palace-${{ inputs.tag || github.ref_name }}-SHA256SUMS.txt"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* \
            --verify-tag \
            --title "K-O Palace $VERSION" \
            --generate-notes