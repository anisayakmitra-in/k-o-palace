name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Format, Check, Clippy, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kopalace
          POSTGRES_PASSWORD: kopalace
          POSTGRES_DB: kopalace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check --locked
        run: cargo check --locked --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets -- --test-threads=1

      - name: cargo test with PostgreSQL
        run: cargo test --locked --all-targets --features postgres -- --test-threads=1
        env:
          KOP_TEST_DATABASE_URL: postgres://kopalace:kopalace@localhost:5432/kopalace_test

      - name: cargo audit
        run: cargo install cargo-audit --locked && cargo audit

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: k-o-palace-linux
          path: target/release/k-o-palace

  migration-verify:
    name: Verify Migrations
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kopalace
          POSTGRES_PASSWORD: kopalace
          POSTGRES_DB: kopalace_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Run migrations
        run: sqlx migrate run --source migrations
        env:
          DATABASE_URL: postgres://kopalace:kopalace@localhost:5432/kopalace_migrate

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate SBOM with cargo-cyclonedx
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx -f json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: k-o-palace-sbom
          path: "*.cdx.json"
          if-no-files-found: error

  release-gates:
    name: Release Gates
    if: always()
    needs: [validate, build, migration-verify, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to pass
        shell: bash
        run: |
          results=(
            "validate=${{ needs.validate.result }}"
            "build=${{ needs.build.result }}"
            "migration-verify=${{ needs.migration-verify.result }}"
            "sbom=${{ needs.sbom.result }}"
          )
          for result in "${results[@]}"; do
            echo "$result"
            if [[ "$result" != *=success ]]; then
              exit 1
            fi
          done