name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.97.1

permissions:
  contents: read

jobs:
  validate:
    name: Format, Check, Clippy, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: kopalace
          POSTGRES_PASSWORD: kopalace
          POSTGRES_DB: kopalace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify release packaging helpers
        run: bash scripts/test-release-packaging.sh

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check --locked
        run: cargo check --locked --all-targets

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo test with PostgreSQL
        run: cargo test --locked --all-targets --features postgres
        env:
          KOP_TEST_DATABASE_URL: postgres://kopalace:kopalace@localhost:5432/kopalace_test

      - name: cargo audit
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit

  web:
    name: Build Web Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Test web client
        run: npm test --prefix web
      - name: Build web client
        run: npm run build --prefix web
      - name: Audit web dependencies
        run: npm audit --prefix web --audit-level=high

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [validate, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33

      - name: Build release
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k-o-palace-linux
          path: target/release/k-o-palace

  migration-verify:
    name: Verify Migrations
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: kopalace
          POSTGRES_PASSWORD: kopalace
          POSTGRES_DB: kopalace_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls

      - name: Run migrations
        run: sqlx migrate run --source migrations
        env:
          DATABASE_URL: postgres://kopalace:kopalace@localhost:5432/kopalace_migrate

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33

      - name: Generate SBOM with cargo-cyclonedx
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx -f json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k-o-palace-sbom
          path: "*.cdx.json"
          if-no-files-found: error

  release-gates:
    name: Release Gates
    if: always()
    needs: [validate, web, build, migration-verify, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to pass
        shell: bash
        run: |
          results=(
            "validate=${{ needs.validate.result }}"
            "web=${{ needs.web.result }}"
            "build=${{ needs.build.result }}"
            "migration-verify=${{ needs.migration-verify.result }}"
            "sbom=${{ needs.sbom.result }}"
          )
          for result in "${results[@]}"; do
            echo "$result"
            if [[ "$result" != *=success ]]; then
              exit 1
            fi
          done