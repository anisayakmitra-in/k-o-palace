[package]
name = "k-o-palace"
version = "0.1.0"
edition = "2021"
description = "Open AI Runtime Registry — the sovereign ecosystem for discovering, validating, signing, versioning, evolving, and distributing AI runtime components."
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
serde_urlencoded = "0.7"
validator = { version = "0.19", features = ["derive"] }
regex = "1"
url = "2"
semver = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"
argon2 = "0.5"
bcrypt = "0.16"
# SQLx with runtime choice (default tokio + rustls)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "json"], optional = true }
# Configuration
config = "0.15"
# Rate limiting
governor = "0.8"
# Testing
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
tower_governor = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio-test = "0.4"

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]
reqwest = ["dep:reqwest"]
memory = []